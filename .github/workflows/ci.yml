name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily canary run at 06:00 UTC to verify extractors haven't broken
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (ffmpeg) on Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt update && sudo apt install -y ffmpeg

    - name: Install system dependencies (ffmpeg) on macOS
      if: runner.os == 'macOS'
      run: |
        brew install ffmpeg

    - name: Install system dependencies (ffmpeg) on Windows
      if: runner.os == 'Windows'
      run: |
        choco install ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[all]"

    - name: Run Doctor check
      run: |
        python scripts/viewer.py doctor

    - name: Run Unit Tests
      run: |
        python -m unittest discover tests

  live-canary:
    name: Live Canary Extraction Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install ffmpeg
      run: |
        sudo apt update && sudo apt install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[all]"

    - name: Run live canary test on public Short
      run: |
        python scripts/viewer.py inspect "https://www.youtube.com/shorts/RRqwSLMK1hQ" --no-speech --json
