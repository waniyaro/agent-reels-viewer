name: CI

on:
  push:
    branches: [ main, wip/* ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily canary run at 06:00 UTC to verify extractors haven't broken
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (ffmpeg) on Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt update && sudo apt install -y ffmpeg

    - name: Install system dependencies (ffmpeg) on macOS
      if: runner.os == 'macOS'
      run: |
        brew install ffmpeg

    - name: Install system dependencies (ffmpeg) on Windows
      if: runner.os == 'Windows'
      run: |
        choco install ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[all]"

    - name: Run Doctor check via installed CLI
      run: |
        agent-reels-viewer doctor

    - name: Run Unit Tests
      run: |
        python -m unittest discover tests

  live-canary:
    name: Live Canary Extraction Check
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install ffmpeg
      run: |
        sudo apt update && sudo apt install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[all]"

    - name: Canary 1 - YouTube Short Inspection (RRqwSLMK1hQ)
      run: |
        OUT={"status": "error", "error_code": "LOCAL_FILE_NOT_FOUND", "message": "Local video file not found at: "https://www.youtube.com/shorts/RRqwSLMK1hQ""}
        echo "Output: "
        python scripts/ci_check.py youtube ""

    - name: Canary 2 - TikTok Public Metadata (7106594312292453675)
      run: |
        OUT={"status": "error", "error_code": "LOCAL_FILE_NOT_FOUND", "message": "Local video file not found at: "https://www.tiktok.com/@tiktok/video/7106594312292453675""}
        echo "Output: "
        python scripts/ci_check.py tiktok ""

    - name: Canary 3 - Instagram Reel Check (C8P0Y8KItbQ, expects success or NEEDS_COOKIES)
      run: |
        OUT={"status": "error", "error_code": "LOCAL_FILE_NOT_FOUND", "message": "Local video file not found at: "https://www.instagram.com/reel/C8P0Y8KItbQ""}
        echo "Output: "
        python scripts/ci_check.py instagram ""

    - name: Canary 4 - Speech Video (8Zx04h24uBs, expects speech_status=ok)
      run: |
        OUT=
        echo "Output: "
        python scripts/ci_check.py speech ""
